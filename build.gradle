plugins {
	id 'java'
	// ShadowJar
	// https://mvnrepository.com/artifact/com.gradleup.shadow/shadow-gradle-plugin
	id 'com.gradleup.shadow' version '9.6.1'
}

// Getting version
apply from: 'version.gradle'

String version = loadVersion().getVersion()
String mainClassName = 'dev.fileeditor.votl.Main'

repositories {
	// Use Maven Central for resolving dependencies
	mavenCentral()
}

dependencies {
	// JDA library and additions
	// https://mvnrepository.com/artifact/net.dv8tion/JDA
	implementation('net.dv8tion:JDA:6.7.0') {						// JDA library
		exclude module: 'opus-java'
		exclude module: 'tink'
	}
	// https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
	implementation 'ch.qos.logback:logback-classic:1.6.6'			// Logging (required by JDA)

	// Tools
	// https://mvnrepository.com/artifact/com.jayway.jsonpath/json-path
	implementation 'com.jayway.jsonpath:json-path:3.0.0'			// json path-er
	// https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
	implementation 'org.xerial:sqlite-jdbc:3.54.1.0'				// sqlite database
	// https://mvnrepository.com/artifact/org.jsoup/jsoup
	implementation 'org.jsoup:jsoup:1.23.2'							// HTML tools
	// https://mvnrepository.com/artifact/io.github.java-diff-utils/java-diff-utils
	implementation 'io.github.java-diff-utils:java-diff-utils:4.18'	// Diff finder
	// https://mvnrepository.com/artifact/org.json/json
	implementation 'org.json:json:20260814'							// JsonObject
	// https://mvnrepository.com/artifact/com.github.ben-manes.caffeine/caffeine
	implementation 'com.github.ben-manes.caffeine:caffeine:3.3.1'	// Cache
	// https://mvnrepository.com/artifact/org.reflections/reflections
	implementation 'org.reflections:reflections:0.10.2'				// Reflections for auto-load
	// https://mvnrepository.com/artifact/commons-cli/commons-cli
	implementation 'commons-cli:commons-cli:1.11.0'					// CLI arguments

	// Metrics
	// https://mvnrepository.com/artifact/io.github.classgraph/classgraph
	implementation 'io.github.classgraph:classgraph:6.0.1'			// Class lookup
	// https://mvnrepository.com/artifact/org.jfree/jfreechart
	implementation 'org.jfree:jfreechart:1.5.6'						// Charts

	// Images
	// https://mvnrepository.com/artifact/com.twelvemonkeys.imageio/imageio-webp
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'	// WebP support for ImageIO (pure Java)

	// Eval
	// https://mvnrepository.com/artifact/org.apache.groovy/groovy
	implementation 'org.apache.groovy:groovy:6.0.0'			    	// Groovy - code evaluation

	// Testing
	// Source: https://mvnrepository.com/artifact/org.junit/junit-bom
	testImplementation platform('org.junit:junit-bom:6.1.3')
	// Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
	testImplementation 'org.junit.jupiter:junit-jupiter'
	// Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
}

// Downloads every dependency without needing the sources.
// Lets the Dockerfile cache dependencies in a layer of their own.
tasks.register('resolveDependencies') {
	group = 'build setup'
	description = 'Resolves and downloads all dependencies'
	doLast {
		// Only the project's own classpaths — plugin-internal configurations
		// (such as Shadow's R8) resolve from repositories we do not declare.
		['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
				.collect { configurations.named(it) }
				.each { it.get().resolve() }
	}
}

// jar's Manifest
tasks.jar {
	enabled = false
}

// ShadowJar + copy to base folder
tasks.register('copyJar') {
	def shadow = tasks.named('shadowJar')
	dependsOn(shadow)
	def outFile = shadow.flatMap { it.archiveFile }          // captured at config time
	def destName = "VOTL-${version}.jar"
	doLast {
		copy {
			from(outFile)
			into('.')
			rename { destName }
		}
	}
}

// Refresh the root copy whether you run `build` or `shadowJar`
tasks.build {
	dependsOn(copyJar)
}

// ShadowJar config
tasks.shadowJar {
	finalizedBy(copyJar)
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	mergeServiceFiles() // keeps ImageIO plugin (SPI) registrations

	archiveBaseName = 'VOTL'
	archiveVersion = getFullVersion(version)
	archiveClassifier = ''

	exclude('META-INF/*.SF')
	exclude('META-INF/*.DSA')
	exclude('META-INF/*.RSA')
	exclude('META-INF/LICENSE*')
	exclude('META-INF/NOTICE*')
	exclude('META-INF/DEPENDENCIES')

	manifest.attributes(
			'Implementation-Title': 'VOTL Bot',
			'Implementation-Version': getFullVersion(version),
			'Implementation-Vendor': 'FiLe group',
			'Main-Class': mainClassName
	)
}

tasks.test {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
	}
}

String getFullVersion(String baseVersion) {
	def sha = project.findProperty("sha") as String
	def isSnapshot = project.hasProperty("snap")

	def fullVersion = baseVersion

	if (isSnapshot) {
		fullVersion += "-SNAPSHOT"
	}
	if (sha != null) {
		fullVersion += "+${sha}"
	}

	// Use this version as the project version
	return fullVersion
}

compileJava.options.encoding = 'UTF-8'
